name: Build and publish Retifoz release

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "requirements.txt"
      - "retifoz.spec"
      - "logo11.ico"
      - "logo_retifoz/**"
      - ".github/workflows/publicar-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retifoz-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Calculate and commit next version
        id: version
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.RETIFOZ_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: Meiaum061/FCA-ATUALIZADORr
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) {
            throw "Configure o secret RETIFOZ_RELEASE_TOKEN com acesso Contents: Read and write ao repositório de releases."
          }

          $Headers = @{
            Authorization = "Bearer $env:RELEASE_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $BaseApi = "https://api.github.com/repos/$env:RELEASE_REPOSITORY"

          try {
            $RepositoryInfo = Invoke-RestMethod -Uri $BaseApi -Headers $Headers
          } catch {
            throw "Não foi possível acessar o repositório de releases. Confira o secret e o nome do repositório: $($_.Exception.Message)"
          }
          if ($RepositoryInfo.full_name -ne $env:RELEASE_REPOSITORY) {
            throw "O GitHub retornou um repositório de releases inesperado."
          }

          try {
            Invoke-RestMethod `
              -Uri "$BaseApi/git/ref/heads/main" `
              -Headers $Headers | Out-Null
          } catch {
            $StatusCode = 0
            try {
              $StatusCode = [int]$_.Exception.Response.StatusCode
            } catch {}
            if ($StatusCode -ne 404) {
              throw "Não foi possível verificar a branch main do repositório de releases: $($_.Exception.Message)"
            }

            Write-Host "Inicializando a branch main no repositório de releases vazio..."
            $Blob = Invoke-RestMethod `
              -Uri "$BaseApi/git/blobs" `
              -Method POST `
              -Headers $Headers `
              -ContentType "application/json" `
              -Body (@{ content = "Retifoz application releases."; encoding = "utf-8" } | ConvertTo-Json -Compress)
            $Tree = Invoke-RestMethod `
              -Uri "$BaseApi/git/trees" `
              -Method POST `
              -Headers $Headers `
              -ContentType "application/json" `
              -Body (@{
                tree = @(
                  @{
                    path = "README.md"
                    mode = "100644"
                    type = "blob"
                    sha = $Blob.sha
                  }
                )
              } | ConvertTo-Json -Depth 5 -Compress)
            $Commit = Invoke-RestMethod `
              -Uri "$BaseApi/git/commits" `
              -Method POST `
              -Headers $Headers `
              -ContentType "application/json" `
              -Body (@{
                message = "Initialize Retifoz releases repository"
                tree = $Tree.sha
                parents = @()
              } | ConvertTo-Json -Depth 5 -Compress)
            Invoke-RestMethod `
              -Uri "$BaseApi/git/refs" `
              -Method POST `
              -Headers $Headers `
              -ContentType "application/json" `
              -Body (@{
                ref = "refs/heads/main"
                sha = $Commit.sha
              } | ConvertTo-Json -Compress) | Out-Null
          }

          $ReleaseVersion = [version]"0.0.0"
          try {
            $LatestRelease = Invoke-RestMethod `
              -Uri "$BaseApi/releases/latest" `
              -Headers $Headers
            $LatestText = [string]$LatestRelease.tag_name -replace "^v", ""
            if ($LatestText -notmatch "^\d+\.\d+\.\d+$") {
              throw "A tag da última release '$($LatestRelease.tag_name)' não segue MAJOR.MINOR.PATCH."
            }
            $ReleaseVersion = [version]$LatestText
          } catch {
            $StatusCode = 0
            try {
              $StatusCode = [int]$_.Exception.Response.StatusCode
            } catch {}
            if ($StatusCode -ne 404) {
              throw "Não foi possível consultar a última release: $($_.Exception.Message)"
            }
          }

          $VersionPath = "servicos/atualizador.py"
          $VersionSource = Get-Content -LiteralPath $VersionPath -Raw
          $VersionMatches = [regex]::Matches(
            $VersionSource,
            '(?m)^VERSAO_ATUAL = "(\d+\.\d+\.\d+)"[ \t]*$'
          )
          if ($VersionMatches.Count -ne 1) {
            throw "VERSAO_ATUAL deve aparecer exatamente uma vez em $VersionPath."
          }
          $SourceVersionText = $VersionMatches[0].Groups[1].Value
          $SourceVersion = [version]$SourceVersionText
          $VersionBase = $SourceVersion
          if ($ReleaseVersion -gt $VersionBase) {
            $VersionBase = $ReleaseVersion
          }

          $NextVersion = [version]::new(
            $VersionBase.Major,
            $VersionBase.Minor,
            ($VersionBase.Build + 1)
          )
          $NextVersionText = $NextVersion.ToString(3)
          $Tag = "v$NextVersionText"
          $UpdatedSource = [regex]::new(
            '(?m)^VERSAO_ATUAL = "\d+\.\d+\.\d+"[ \t]*$',
            [System.Text.RegularExpressions.RegexOptions]::Multiline
          ).Replace(
            $VersionSource,
            "VERSAO_ATUAL = `"$NextVersionText`"",
            1
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD $VersionPath),
            $UpdatedSource,
            [System.Text.UTF8Encoding]::new($false)
          )

          "version_path=$VersionPath" >> $env:GITHUB_OUTPUT
          "version=$NextVersionText" >> $env:GITHUB_OUTPUT
          "tag=$Tag" >> $env:GITHUB_OUTPUT

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar pip." }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar dependências do app." }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar PyInstaller." }

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --distpath dist `
            --workpath build/release `
            retifoz.spec
          if ($LASTEXITCODE -ne 0) { throw "O build do executável falhou." }
          if (-not (Test-Path "dist/retifoz.exe" -PathType Leaf)) {
            throw "PyInstaller terminou sem gerar dist/retifoz.exe."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RETIFOZ_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: Meiaum061/FCA-ATUALIZADORr
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "O secret RETIFOZ_RELEASE_TOKEN não está configurado."
          }

          gh release create $env:RELEASE_TAG `
            "dist/retifoz.exe#Retifoz $env:RELEASE_VERSION" `
            --repo $env:RELEASE_REPOSITORY `
            --target main `
            --title "Retifoz $env:RELEASE_VERSION" `
            --notes "Atualização automática do Retifoz para a versão $env:RELEASE_VERSION."
          if ($LASTEXITCODE -ne 0) {
            throw "O GitHub CLI falhou ao criar a release. Confira o log do job."
          }

      - name: Commit published version to source
        shell: pwsh
        env:
          VERSION_PATH: ${{ steps.version.outputs.version_path }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $env:VERSION_PATH
          git commit -m "chore: bump Retifoz version to $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível criar o commit da versão publicada."
          }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível enviar o número da versão ao repositório do app."
          }
